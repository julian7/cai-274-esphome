substitutions:
  name: wifi-clock
  friendly_name: "WiFi Clock"
  ldr_dim_threshold_v: "1.0"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - sntp_sync.h
  on_boot:
    - priority: 900
      then:
        - lambda: id(display)->set_no_sync(true);
