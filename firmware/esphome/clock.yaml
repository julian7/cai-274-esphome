  #   then:
  #     - lambda: |-
  #         id(display)->set_effect_speed(id(effect_speed).state);
  #         id(display)->set_effect_angle(id(effect_angle).state);
  #         id(display)->set_effect_hue_span(id(effect_hue_span).state);
  #         id(display)->set_flash_fade(id(fx_flash_fade).state);
  #         std::string sp = id(effect_spread).current_option();
  #         id(display)->set_effect_spread(sp == "Per Digit" ? 1 : sp == "Per LED" ? 2 : 0);
  #         std::string ef = id(effect_mode).current_option();
  #         id(display)->set_effect(ef == "Color Cycle" ? 1 : ef == "Flash" ? 2 : 0);

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
- source:
    type: local
    path: components

logger:
  level: VERBOSE

api:
  encryption:
    key: !secret api_key
  # actions:
  # - action: set_digits_color
  #   variables:
  #     red: int
  #     green: int
  #     blue: int
  #   then:
  #   - lambda: |-
  #       id(display)->set_digit_color(red /255.0f, green / 255.0f, blue / 255.0f);

ota:
  - platform: esphome
    encryption:
      key: !secret api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5db
  ap:
    ssid: ${friendly_name} Setup
    password: !secret ap_password
  on_connect:
    - lambda: id(display)->set_online(true);
  on_disconnect:
    - lambda: id(display)->set_online(false);

captive_portal:

time:
- platform: homeassistant
  id: ha_time
  timezone: !secret timezone
  on_time_sync:
    then:
      - lambda: |-
          const auto local = id(ha_time).now();
          const auto utc = id(ha_time).utcnow();
          ESP_LOGI("clock_time", "HA sync: local=%04d-%02d-%02d %02d:%02d:%02d UTC=%04d-%02d-%02d %02d:%02d:%02d",
                   local.year, local.month, local.day_of_month, local.hour,
                   local.minute, local.second, utc.year, utc.month,
                   utc.day_of_month, utc.hour, utc.minute, utc.second);
      - logger.log: Home Assistant time synchronization succeeded
      - lambda: id(display)->set_no_sync(false);
- platform: sntp
  id: sntp_time
  timezone: !secret timezone
  on_time_sync:
    then:
      - lambda: |-
          const auto local = id(sntp_time).now();
          const auto utc = id(sntp_time).utcnow();
          ESP_LOGI("clock_time", "SNTP sync: local=%04d-%02d-%02d %02d:%02d:%02d UTC=%04d-%02d-%02d %02d:%02d:%02d",
                   local.year, local.month, local.day_of_month, local.hour,
                   local.minute, local.second, utc.year, utc.month,
                   utc.day_of_month, utc.hour, utc.minute, utc.second);
      - logger.log: SNTP time synchronization succeeded
      - lambda: id(display)->set_no_sync(false);

tm1640:
  id: display
  clk_pin: GPIO5
  dio_pin: GPIO6
  brightness: 255 # common software brightness, 0-255
  driver_brightness: 4 # TM1640 global hardware brightness, 0-7
  time_id: ha_time
  twelve_hour: true
  blink_colon: true
  red: 255
  green: 255
  blue: 255

light:
- platform: tm1640
  id: display_color
  tm1640_id: display
  name: Display Color
  restore_mode: RESTORE_DEFAULT_ON
  dim_dark: 50%
  dim_darker: 25%

switch:
- platform: template
  id: twelve_hour_mode
  name: 12 Hour Time
  optimistic: true
  restore_mode: RESTORE_DEFAULT_ON
  turn_on_action:
  - lambda: id(display)->set_twelve_hour(true);
  turn_off_action:
  - lambda: id(display)->set_twelve_hour(false);
- platform: template
  id: colon_blink
  name: Blink Colon
  optimistic: true
  restore_mode: RESTORE_DEFAULT_ON
  turn_on_action:
  - lambda: id(display)->set_blink_colon(true);
  turn_off_action:
  - lambda: id(display)->set_blink_colon(false);

select:
- platform: template
  id: temperature_unit
  name: Temperature Unit
  options:
  - C
  - F
  initial_option: C
  optimistic: true
  restore_value: true

output:
- platform: gpio
  id: buzzer_output
  pin:
    number: GPIO3
    inverted: true

button:
- platform: template
  name: Buzzer
  icon: mdi:bell-ring
  on_press:
  - repeat:
      count: 3
      then:
      - output.turn_on: buzzer_output
      - delay: 100ms
      - output.turn_off: buzzer_output
      - delay: 100ms

binary_sensor:
- platform: gpio
  id: button_1
  name: Button 1
  pin:
    number: GPIO2
    ignore_strapping_warning: true
    mode:
      input: true
      pullup: true
    inverted: true
  filters:
  - delayed_on: 20ms
  - delayed_off: 20ms
  on_press:
  - lambda: |-
      id(display)->show_temperature(
          id(ntc_temperature).state,
          id(temperature_unit).current_option() == "F");
- platform: gpio
  id: button_2
  name: Button 2
  pin:
    number: GPIO8
    ignore_strapping_warning: true
    mode:
      input: true
      pullup: true
    inverted: true
  filters:
  - delayed_on: 20ms
  - delayed_off: 20ms
  on_press:
  - lambda: id(display)->set_no_sync(true);
  - component.update: ha_time
  - lambda: force_sntp_sync();
- platform: gpio
  id: button_3
  name: Button 3
  pin:
    number: GPIO20
    mode:
      input: true
      pullup: true
    inverted: true
  filters:
  - delayed_on: 20ms
  - delayed_off: 20ms
- platform: gpio
  id: button_4
  name: Button 4
  pin:
    number: GPIO21
    mode:
      input: true
      pullup: true
    inverted: true
  filters:
    - delayed_on: 20ms
    - delayed_off: 20ms
- platform: gpio
  id: sound_activity
  name: Sound Activity
  device_class: sound
  pin:
    number: GPIO4
    mode:
      input: true
      pullup: true
    inverted: true
  filters:
    - delayed_on_off:
        time_on: 1ms
        time_off: 5s
  on_state:
    then:
      - script.execute: update_display_dimming
sensor:
- platform: adc
  id: ntc_voltage
  pin: GPIO0
  name: NTC Voltage
  attenuation: auto
  update_interval: 30s
  unit_of_measurement: V
  device_class: voltage
  state_class: measurement
  accuracy_decimals: 2
  internal: true
- platform: resistance
  id: ntc_resistance
  sensor: ntc_voltage
  configuration: DOWNSTREAM
  resistor: 10kOhm
  internal: true
- platform: ntc
  id: ntc_temperature
  sensor: ntc_resistance
  calibration:
    b_constant: 3950
    reference_temperature: 25°C
    reference_resistance: 10kOhm
  name: NTC Temperature
  device_class: temperature
  state_class: measurement
  accuracy_decimals: 1
  filters:
    - offset: -3.0
- platform: adc
  id: ldr_voltage
  pin: GPIO1
  name: LDR Voltage
  attenuation: auto
  update_interval: 5s
  unit_of_measurement: V
  device_class: voltage
  state_class: measurement
  accuracy_decimals: 2
  on_value:
    then:
      - script.execute: update_display_dimming

script:
  - id: update_display_dimming
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(ldr_voltage).state > ${ldr_dim_threshold_v}f;
          then:
            - if:
                condition:
                  binary_sensor.is_on: sound_activity
                then:
                  - lambda: id(display)->dim_dark();
                else:
                  - lambda: id(display)->dim_darker();
          else:
            - lambda: id(display)->dim_normal();
